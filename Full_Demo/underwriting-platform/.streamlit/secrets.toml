# Copy to .streamlit/secrets.toml and fill in. NEVER commit the real file.

[mariadb]
host = "localhost"
port = 3306
database = "brp_case_study"
# read/write user (ingestion only)
user = "app_user"
password = "app_password"
# read-only user (used by the phi3:mini chat + recommendations)
ro_user = "readonly_user"
ro_password = "readonly_password"

[ollama]
# Where Ollama is serving phi3:mini. Local default shown.
host = "http://localhost:11434"
sql_model = "qwen2.5-coder:7b"

[powerbi]
